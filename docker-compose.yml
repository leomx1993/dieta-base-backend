services:
  dieta-base-db:
    image: postgres:16-alpine
    container_name: dieta-base-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-dieta}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-dieta}
      POSTGRES_DB: ${DATABASE_NAME:-dieta}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-dieta} -d ${DATABASE_NAME:-dieta}"]
      interval: 5s
      timeout: 5s
      retries: 10

  dieta-base-backend:
    build: .
    container_name: dieta-base-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_HOST: dieta-base-db
    depends_on:
      dieta-base-db:
        condition: service_healthy

volumes:
  postgres_data:
